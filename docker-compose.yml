# Orquestra o container: build, portas, variáveis e recursos (sem precisar lembrar flags longas do docker run).

networks:
  # Rede compartilhada com o Sistema Estoque. Ninguém é dono dela: os dois
  # projetos a consomem como external, para que um `docker compose down` de
  # qualquer lado não a destrua. Criar uma vez por máquina:
  #   docker network create sistema-estoque-cd
  # Se ela for recriada assim mesmo (ex.: docker system prune), os containers
  # parados guardam o ID antigo — recupere com `up --force-recreate`.
  sistema-estoque-cd:
    external: true

  # Rede só do price-cd, onde mora o Redis do cache de preço (ADR 0008). Fica
  # fora da `sistema-estoque-cd` de propósito: ninguém além do price-cd precisa
  # do Redis, e um Redis sem senha numa rede compartilhada é superfície à toa.
  # `internal: true` corta a saída para a internet — o Redis não precisa dela.
  price-cd-internal:
    internal: true

services:
  price-researcher-dev:
    # Perfil `dev`: este serviço NÃO sobe com `docker compose up -d`.
    #
    # Sem isto, um `up` sem argumento levanta produção e dev juntos — dois
    # containers lendo o mesmo `.env`, logo dois agendadores de bump comentando
    # no SteamTrades com a MESMA conta (risco de ban, ver PR 7), e dois
    # Chromium disputando o `mem_limit` que já derrubou a VPS em 2026-08-24.
    #
    # Para subir o dev: `docker compose --profile dev up price-researcher-dev`
    profiles: ["dev"]

    build:
      context: .
      target: dev

    container_name: price-researcher-dev

    # Mesmo motivo do serviço de produção — ver o comentário lá embaixo.
    init: true

    ports:
      - "${HOST_PORT_DEV:-5556}:5555"

    env_file:
      - .env

    environment:
      DOCKER: "true"
      NODE_ENV: development

      # Fixo aqui, e não no .env, que a produção também lê: com os dois de pé, seriam
      # dois agendadores comentando no SteamTrades com a mesma conta (risco de ban).
      BUMP_SCHEDULER_ENABLED: "false"


      # Fixo, não interpolado do .env: o lado container do mapeamento de portas
      # acima é 5555 literal, então deixar o .env escolher outra porta só
      # produziria um container que publica uma porta onde ninguém escuta.
      PORT: 5555
      CHROME_PATH: /usr/bin/chromium

      # O Redis do dev, nunca o da produção: os dois serviços leem o mesmo
      # `.env`, por isso as URLs moram aqui e não lá. Se o dev usasse o Redis de
      # produção, código em desenvolvimento gravaria preços no cache que a
      # produção lê (ADR 0008) — e um worker de dev consumiria pedidos reais da
      # fila (ADR 0009). Cache no banco 0, fila no banco 1, mesmo servidor.
      REDIS_URL: redis://redis-dev:6379/0
      QUEUE_REDIS_URL: redis://redis-dev:6379/1

    # Só sobe o Redis junto; não espera ele ficar pronto — o app pesquisa sem
    # cache até a conexão sair (ADR 0008), e recusa a pesquisa autenticada até a
    # fila conectar (ADR 0009).
    depends_on:
      redis-dev:
        condition: service_started

    # Mesmo motivo do serviço de produção — ver o comentário lá embaixo.
    stop_grace_period: 90s

    volumes:
      - ./src:/app/src
      - ./public:/app/public

    shm_size: 1gb

    # Mesma rede de segurança do serviço de produção — ver o comentário lá embaixo.
    mem_limit: 2g
    pids_limit: 512

    networks:
      - sistema-estoque-cd
      - price-cd-internal

  price-researcher:
    # Em produção a imagem vem do GHCR, construída pelo CI (.github/workflows/deploy.yml;
    # ver docs/adr/0006-imagem-de-producao-e-construida-no-ci.md): a CPU da VPS é
    # emprestada e um build frio ali passava dos 10 minutos.
    #
    # `IMAGE_TAG` existe para rollback manual — `IMAGE_TAG=sha-<commit> docker compose up -d
    # price-researcher`. O nome é minúsculo porque o GHCR exige.
    image: ghcr.io/joaovitor2310/price-cd:${IMAGE_TAG:-latest}

    # Plano B se o GHCR estiver fora: `docker compose up -d --build price-researcher`.
    # O deploy normal nunca usa — ele faz `pull` explícito e aborta se falhar.
    build: .

    container_name: price-researcher

    restart: unless-stopped

    # Um init de verdade como PID 1. Sem ele o `exec node` do docker/start.sh
    # faz do Node o PID 1, e o Node não é um init: o libuv só dá `waitpid` nos
    # filhos que ele mesmo criou. Todo neto do Chromium (renderer, GPU process,
    # zygote) reparentado para o PID 1 ao morrer vira zumbi PERMANENTE — não
    # gasta memória, mas ocupa um slot da tabela de processos e conta para o
    # pids_limit. Em 2026-09-18 a produção chegou a 511/512 PIDs com a memória
    # em 1 GB de 2 GB: qualquer fork() passou a falhar com "Cannot fork",
    # inclusive o `docker exec`, e o primeiro a quebrar foi a busca de binário
    # do chrome-launcher ao abrir o browser para o AllKeyShop.
    # O cleanupBrowser continua necessário (ele derruba a árvore); o init é
    # quem COLHE os mortos. São papéis diferentes — não remover nenhum dos dois.
    init: true

    ports:
      - "${HOST_PORT:-5555}:5555"

    env_file:
      - .env

    environment:
      # Sinaliza ao app que está no Docker: em puppeteer-browser.ts isso desliga o Xvfb interno do puppeteer-real-browser
      # para não haver dois servidores X (o nosso sobe no docker/start.sh).
      DOCKER: "true"

      # Modo produção para Node (menos verbosidade, algumas libs mudam comportamento).
      NODE_ENV: production


      # Fixo, não interpolado do .env: o lado container do mapeamento de portas
      # acima é 5555 literal, então deixar o .env escolher outra porta só
      # produziria um container que publica uma porta onde ninguém escuta.
      PORT: 5555

      # Caminho do Chromium instalado via apt na imagem. O chrome-launcher / fluxo real-browser usa isso em vez do Chrome baixado pelo Puppeteer.
      CHROME_PATH: /usr/bin/chromium

      # Cache de preço (ADR 0008) no banco 0 e fila durável da pesquisa (ADR
      # 0009) no banco 1 — o mesmo servidor, bancos lógicos separados para que
      # limpar o cache (`redis-cli -n 0 FLUSHDB`) nunca toque na fila. Aqui, e
      # não no `.env`, porque o dev lê o mesmo `.env` e precisa apontar para o
      # próprio Redis.
      REDIS_URL: redis://redis:6379/0
      QUEUE_REDIS_URL: redis://redis:6379/1

    # O `docker compose up -d price-researcher` do deploy só sobe o que o serviço
    # declara aqui — sem isto o Redis nunca subiria. `service_started`, não
    # `service_healthy`: o boot não espera o Redis — o app pesquisa sem cache e
    # recusa a pesquisa autenticada até a conexão sair. Como o deploy não recria
    # o Redis, cache e fila sobrevivem a ele.
    depends_on:
      redis:
        condition: service_started

    # Quanto o Docker espera entre o SIGTERM e o SIGKILL. O default (10s) não
    # cobre o desligamento ordenado: devolver o job à fila é rápido, mas fechar
    # os quatro donos de Chromium pode levar `BROWSER_CLOSE_TIMEOUT_MS` (15s) +
    # `BROWSER_KILL_GRACE_MS` (3s) cada, um depois do outro. Morto antes disso, o job em andamento
    # ainda não se perde — volta como travado no próximo boot (ADR 0009) —, mas
    # o Chromium vira órfão, o modo de falha de 2026-08-24.
    stop_grace_period: 90s

    # Memória compartilhada (/dev/shm) maior que o padrão (~64MB). Chromium usa muito shm para GPU/texturas;
    # sem isso o browser pode crashar ou ficar instável no Docker.
    shm_size: 1gb

    # Contenção de recursos. Em 2026-08-24 um vazamento de Chromium consumiu
    # 7,4 GB dos 8 GB da VPS em 16 horas: o OOM killer passou a matar processos
    # em loop, o SSH deixou de completar o handshake e o sistema-estoque caiu
    # junto. A causa raiz foi corrigida em src/lib/puppeteer-browser.ts (fechar
    # antes de matar, e matando a árvore inteira de processos), mas estes
    # limites FICAM: são a rede de segurança que garante que um vazamento novo
    # derrube só este container, e não o host. Não remover.
    #
    # mem_limit: operação normal fica bem abaixo de 1 GB (node + um browser).
    # pids_limit: cada Chromium abre ~10-20 processos; o teto corta o acúmulo
    #             antes que ele esgote a tabela de processos do host.
    mem_limit: 2g
    pids_limit: 512

    networks:
      - sistema-estoque-cd
      - price-cd-internal

  # Um Redis só para dois papéis (ADR 0009): o cache de preço do AllKeyShop
  # (banco 0, ADR 0008) e a fila durável da pesquisa (banco 1). A configuração é
  # a que a FILA exige — o cache convive com ela sem custo.
  redis:
    image: redis:7.4-alpine
    container_name: price-researcher-redis

    # - AOF com fsync por segundo: um restart do Redis perde no máximo ~1s de
    #   pedidos da fila. Sem RDB (`--save ""`): o AOF já é a persistência. O
    #   cache vai junto para o disco — poucas escritas por minuto, e passa a
    #   sobreviver ao restart do Redis.
    # - `noeviction`: cheio, recusa escrita em vez de apagar uma chave. Para a
    #   fila é obrigatório (a BullMQ avisa no boot se não for): um lock de job
    #   despejado faz o job rodar de novo e duplicar a Trade. `volatile-lru`
    #   (despejar só o que tem TTL) também não serve: os locks da BullMQ têm TTL.
    #   O cache não precisa de despejo: toda entrada expira em 1h sozinha.
    # - 64 MB: o cache fica em poucos MB (uma entrada tem ~150 bytes, e o
    #   AllKeyShop pesquisa um jogo a cada poucos segundos), um job tem poucos KB
    #   e o registro de execuções é limpo por idade (7 dias os concluídos, 30 os
    #   falhos). Se encher, a escrita do cache falha em silêncio (fail-open) e a
    #   pesquisa autenticada responde 500 — nada é perdido.
    command: >-
      redis-server --appendonly yes --appendfsync everysec --save ""
      --maxmemory 64mb --maxmemory-policy noeviction

    restart: unless-stopped

    # O AOF mora no volume: sem ele, recriar o container (todo deploy que mudar
    # este serviço) apagaria a fila.
    volumes:
      - redis-data:/data

    # Mesma rede de segurança dos serviços do app: a VPS já caiu por OOM
    # (2026-08-24) e por esgotamento de PIDs (2026-09-18). O teto de memória
    # do container fica acima do `maxmemory`, que não conta o overhead do processo.
    init: true
    mem_limit: 128m
    pids_limit: 64

    # Sem `ports:` — nunca exposto na VPS. Só o price-cd o alcança.
    networks:
      - price-cd-internal

  # O Redis do dev — separado do de produção pelo mesmo motivo das URLs do
  # `price-researcher-dev`, e com a mesma configuração do de produção. Sobe só
  # com `--profile dev`.
  redis-dev:
    profiles: ["dev"]
    image: redis:7.4-alpine
    container_name: price-researcher-redis-dev
    command: >-
      redis-server --appendonly yes --appendfsync everysec --save ""
      --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-dev-data:/data
    init: true
    mem_limit: 128m
    pids_limit: 64
    networks:
      - price-cd-internal

volumes:
  # O AOF do Redis: a fila (e o cache, de carona). Um `docker compose down` não
  # apaga; `down -v` apaga a fila junto.
  redis-data:
  redis-dev-data:
