# Orquestra o container: build, portas, variáveis e recursos (sem precisar lembrar flags longas do docker run).

networks:
  # Rede compartilhada com o Sistema Estoque. Ninguém é dono dela: os dois
  # projetos a consomem como external, para que um `docker compose down` de
  # qualquer lado não a destrua. Criar uma vez por máquina:
  #   docker network create sistema-estoque-cd
  # Se ela for recriada assim mesmo (ex.: docker system prune), os containers
  # parados guardam o ID antigo — recupere com `up --force-recreate`.
  sistema-estoque-cd:
    external: true

services:
  price-researcher-dev:
    build:
      context: .
      target: dev

    container_name: price-researcher-dev

    # Mesmo motivo do serviço de produção — ver o comentário lá embaixo.
    init: true

    ports:
      - "${HOST_PORT_DEV:-5556}:5555"

    env_file:
      - .env

    environment:
      DOCKER: "true"
      NODE_ENV: development
      CHROME_PATH: /usr/bin/chromium

    volumes:
      - ./src:/app/src
      - ./public:/app/public

    shm_size: 1gb

    # Mesma rede de segurança do serviço de produção — ver o comentário lá embaixo.
    mem_limit: 2g
    pids_limit: 512

    networks:
      - sistema-estoque-cd

  price-researcher:
    build: .

    container_name: price-researcher

    restart: unless-stopped

    # Um init de verdade como PID 1. Sem ele o `exec node` do docker/start.sh
    # faz do Node o PID 1, e o Node não é um init: o libuv só dá `waitpid` nos
    # filhos que ele mesmo criou. Todo neto do Chromium (renderer, GPU process,
    # zygote) reparentado para o PID 1 ao morrer vira zumbi PERMANENTE — não
    # gasta memória, mas ocupa um slot da tabela de processos e conta para o
    # pids_limit. Em 2026-09-18 a produção chegou a 511/512 PIDs com a memória
    # em 1 GB de 2 GB: qualquer fork() passou a falhar com "Cannot fork",
    # inclusive o `docker exec`, e o primeiro a quebrar foi a busca de binário
    # do chrome-launcher ao abrir o browser para o AllKeyShop.
    # O cleanupBrowser continua necessário (ele derruba a árvore); o init é
    # quem COLHE os mortos. São papéis diferentes — não remover nenhum dos dois.
    init: true

    ports:
      - "${HOST_PORT:-5555}:5555"

    env_file:
      - .env

    environment:
      # Sinaliza ao app que está no Docker: em puppeteer-browser.ts isso desliga o Xvfb interno do puppeteer-real-browser
      # para não haver dois servidores X (o nosso sobe no docker/start.sh).
      DOCKER: "true"

      # Modo produção para Node (menos verbosidade, algumas libs mudam comportamento).
      NODE_ENV: production

      # Caminho do Chromium instalado via apt na imagem. O chrome-launcher / fluxo real-browser usa isso em vez do Chrome baixado pelo Puppeteer.
      CHROME_PATH: /usr/bin/chromium

    # Memória compartilhada (/dev/shm) maior que o padrão (~64MB). Chromium usa muito shm para GPU/texturas;
    # sem isso o browser pode crashar ou ficar instável no Docker.
    shm_size: 1gb

    # Contenção de recursos. Em 2026-08-24 um vazamento de Chromium consumiu
    # 7,4 GB dos 8 GB da VPS em 16 horas: o OOM killer passou a matar processos
    # em loop, o SSH deixou de completar o handshake e o sistema-estoque caiu
    # junto. A causa raiz foi corrigida em src/lib/puppeteer-browser.ts (fechar
    # antes de matar, e matando a árvore inteira de processos), mas estes
    # limites FICAM: são a rede de segurança que garante que um vazamento novo
    # derrube só este container, e não o host. Não remover.
    #
    # mem_limit: operação normal fica bem abaixo de 1 GB (node + um browser).
    # pids_limit: cada Chromium abre ~10-20 processos; o teto corta o acúmulo
    #             antes que ele esgote a tabela de processos do host.
    mem_limit: 2g
    pids_limit: 512

    networks:
      - sistema-estoque-cd
